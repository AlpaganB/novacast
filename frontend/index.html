<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="NovaCast: Advanced AI-powered weather forecasting providing accurate long-term predictions, daily planner recommendations, and climate insights.">
    <meta name="keywords" content="weather, forecast, AI weather, long-term forecast, climate, NovaCast, meteorology">
    <meta name="author" content="NovaPulse Team">
    <meta name="theme-color" content="#2979FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Novacast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.5.15">
    <link rel"icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="favicon.png" alt="NovaPulse Team Logo" class="team-logo">
                <span data-i18n="appTitle">Novacast</span>
            </div>
            <div class="controls">
                <button class="lang-toggle" onclick="toggleLanguage()">TR</button>
            </div>
        </header>

        <section class="search-section">
            <div class="search-container">
                <div class="search-group-left">
                    <div class="city-input-wrapper">
                        <input type="text" class="search-input" placeholder="Enter city name..." id="cityInput"
                            data-i18n-placeholder="enterCity">
                        <button class="location-btn" onclick="useMyLocation()" data-i18n-title="useLocation">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="currentColor" stroke="none">
                                <path
                                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
                            </svg>
                        </button>
                    </div>
                    <input type="date" class="date-input" id="dateInput" min="" max="">
                </div>
                <button class="search-btn" onclick="searchWeather()" data-i18n="getWeather">Get Weather</button>
            </div>
            <div id="cacheStatus"></div>
        </section>

        <div class="main-content">
            <div class="weather-card">

                <div class="empty-state-message" id="emptyState">
                    <div class="empty-icon">🌍</div>
                    <h3 data-i18n="welcomeTitle">Welcome to NovaCast</h3>
                    <p data-i18n="welcomeText">Enter a city name above to explore the forecast.</p>
                </div>

                <div class="weather-data-container" id="weatherData" style="display: none;">
                    <div class="location-info">
                        <div class="city-name" id="cityName">-</div>
                        <div class="date-display" id="selectedDate">-</div>
                    </div>

                    <div class="weather-main">
                        <div class="temp-group">
                            <div class="temperature" id="temperature">-°C</div>
                            <div class="temp-low" id="tempLow">↓ -°C</div>
                        </div>
                        <div class="weather-description" id="weatherDesc">-</div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-item full-width">
                            <div data-i18n="precipChance">Precipitation</div>
                            <div id="precipSummary" class="precip-summary">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="weather-card">
                <h3 data-i18n="favCities">Favorite Cities</h3>
                <div class="favorite-cities" id="favoriteCities"></div>
                <button class="search-btn" onclick="addToFavorites()" data-i18n="addToFav">
                    Add Current City to Favorites
                </button>
            </div>
        </div>
    </div>
    </div>

    <footer>
        <div class="footer-content">
            <div>NovaPulse® &middot; 04.10.2025</div>
            <div class="version">Novacast 1.5.15</div>
            <div class="space-apps-logo">
                <img src="Colorway=2-Color White@3x.png" alt="NASA Space Apps Challenge Logo Dark"
                    class="space-logo dark-logo">
                <img src="Colorway=1-Color Black@3x.png" alt="NASA Space Apps Challenge Logo Light"
                    class="space-logo light-logo">
            </div>
        </div>
    </footer>

    <div id="toast-container"></div>
    <script src="script.js?v=1.5.15"></script>

</body>

</html>
